<title>Ratify Music</title>
<style>
  /* The site's dark palette: near-black surface, white primary with black
     text on it, white type at reduced opacity for secondary text. */
  :root { color-scheme: dark; --bg: #080808; --ink: #FAFAFA; --muted: rgba(250, 250, 250, .55); --accent: #FAFAFA; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);
    text-align: center;
  }
  .card { max-width: 340px; }
  .logo { width: 112px; height: 112px; margin: 0 auto 24px; display: block; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 10px; font-weight: 700; letter-spacing: -0.01em; }
  p { font-size: 15px; line-height: 1.55; margin: 0 0 28px; color: var(--muted); }
  button {
    appearance: none; cursor: pointer; width: 100%;
    background: var(--accent); color: #080808; border: 0;
    font: inherit; font-weight: 700; font-size: 16px;
    padding: 15px 24px; border-radius: 999px;
    transition: transform .12s ease, opacity .12s ease;
  }
  button:disabled { opacity: .5; }
  button:active { transform: scale(.98); }
  .status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 18px; }
</style>

    <h1>You're offline</h1>
    <p>Ratify Music needs a connection to load games, rankings and music. Check your network and try again.</p>
    <button id="retry" type="button">Try again</button>
    <div class="status" id="status" role="status"></div>
  </div>

<script>
  // Must match server.url in capacitor.config.ts.
  var SITE = 'https://ratifymusic.com/';
  var btn = document.getElementById('retry');
  // Not `status`: a global `var status` is coerced to a string by the legacy
  // window.status property, so every write to it is a silent no-op.
  var statusEl = document.getElementById('status');

  function retry() {
    btn.disabled = true;
    statusEl.textContent = 'Reconnecting…';
    // Ask for a real resource rather than trusting navigator.onLine, which
    // reports "online" behind captive portals and dead Wi-Fi.
    fetch(SITE + '?_=' + Date.now(), { cache: 'no-store', mode: 'no-cors' })
      .then(function () { window.location.replace(SITE); })
      .catch(function () {
        btn.disabled = false;
        statusEl.textContent = 'Still offline.';
      });
  }

  btn.addEventListener('click', retry);
  window.addEventListener('online', retry);
</script>
